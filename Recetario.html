(()=>{'use strict';const KEY='albahaca_recipes_v1',CATS=['Todas','Desayunos','Platos fuertes','Pastelería','Bebidas','Entradas','Postres','Otras','Favoritas'];let recipes=[],category='Todas',query='',editing=null,detailId=null,cookIndex=0,cookId=null,servingMultiplier=1,checkedIngredients=new Map();const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||'r'+Date.now()+Math.random().toString(36).slice(2);function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3000)}function valid(r){return r&&typeof r==='object'&&!Array.isArray(r)&&typeof r.title==='string'&&r.title.trim().length>0&&r.title.length<250&&Array.isArray(r.ingredients)&&r.ingredients.every(x=>typeof x==='string')&&Array.isArray(r.steps)&&r.steps.every(x=>typeof x==='string')&&r.ingredients.length<=200&&r.steps.length<=100}function clean(r){return{id:String(r.id||uid()),title:r.title.trim().slice(0,250),category:CATS.includes(r.category)&&!['Todas','Favoritas'].includes(r.category)?r.category:'Otras',image:typeof r.image==='string'?r.image.slice(0,2000000):'',prep:Math.max(0,Number(r.prep)||0),cook:Math.max(0,Number(r.cook)||0),servings:Math.max(1,Number(r.servings)||1),difficulty:['Fácil','Media','Avanzada'].includes(r.difficulty)?r.difficulty:'Fácil',ingredients:r.ingredients.map(x=>x.slice(0,500)).filter(Boolean),steps:r.steps.map(x=>x.slice(0,5000)).filter(Boolean),notes:typeof r.notes==='string'?r.notes.slice(0,20000):'',favorite:!!r.favorite,created:r.created||new Date().toISOString()}}function save(){try{localStorage.setItem(KEY,JSON.stringify(recipes));return true}catch(e){toast('No hay espacio para guardar. Reduce el tamaño de las fotos y exporta un respaldo.');return false}}function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');recipes un lugar especial. Añade la primera y comienza tu colección.'}</p><button class="primary" id="emptyAdd">+ Añadir receta</button></div></div>`}function row(type,value=''){return `<div class="repeat"><${type==='steps'?'textarea rows="2"':'input type="text"'} class="${type}-input" placeholder="${type==='steps'?'Describe este paso...':'Ej. 200 g de harina'}">${type==='steps'?esc(value):''}</${type==='steps'?'textarea':'input'}><button type="button" class="remove" data-remove aria-label="Eliminar fila">×</button></div>`.replace(type==='steps'?'___not_used___':'placeholder="Ej. 200 g de harina"',type==='steps'?'':'placeholder="Ej. 200 g de harina" value="'+esc(value)+'"')}function form(id){editing=id||null;const r=recipes.find(x=>x.id===id)||{title:'',category:'Platos fuertes',image:'',prep:15,cook:30,servings:2,difficulty:'Fácil',ingredients:[''],steps:[''],notes:''};open(id?'Editar receta':'Una nueva receta',`<form id="recipeForm"><div class="modalcontent"><div class="formgrid"><div class="field full"><label>Nombre de la receta *</label><input name="title" required maxlength="250" placeholder="Ej. Pasta al limón" value="${esc(r.title)}"></div><div class="field"><label>Categoría</label><select name="category">${CATS.filter(x=>!['Todas','Favoritas'].includes(x)).map(c=>`<option ${c===r.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Dificultad</label><select name="difficulty">${['Fácil','Media','Avanzada'].map(d=>`<option ${d===r.difficulty?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Preparación · min</label><input name="prep" type="number" min="0" max="100000" value="${r.prep}"></div><div class="field"><label>Cocción · min</label><input name="cook" type="number" min="0" max="100000" value="${r.cook}"></div><div class="field"><label>Porciones</label><input name="servings" type="number" min="1" max="10000" value="${r.servings}"></div><div class="field"><label>Foto de portada</label><input type="file" id="photoFile" accept="image/*"><span class="help">Se optimiza y guarda en este dispositivo.</span></div><div class="field full"><label>O URL de imagen (opcional)</label><input name="image" placeholder="https://..." value="${r.image.startsWith('data:')?'':esc(r.image)}"><span class="help">Si subes una foto, tendrá prioridad sobre esta URL.</span></div></div><h3 class="sectionlabel">Ingredientes</h3><div id="ingredientRows">${r.ingredients.map(x=>row('ingredients',x)).join('')}</div><button type="button" class="addline" data-add="ingredients">+ Añadir ingrediente</button><h3 class="sectionlabel">Preparación</h3><div id="stepRows">${r.steps.map(x=>row('steps',x)).join('')}</div><button type="button" class="addline" data-add="steps">+ Añadir paso</button><h3 class="sectionlabel">Notas del chef</h3><div class="field"><textarea name="notes" placeholder="Trucos, sustituciones, maridajes...">${esc(r.notes)}</textarea></div><div class="actions">${id?'<button type="button" class="danger" id="deleteRecipe">Eliminar receta</button>':'<span></span>'}<button class="primary" type="submit">${id?'Guardar cambios':'Guardar receta'} →</button></div></div></form>`,true);$('#recipeForm').dataset.existingImage=r.image||''}function prettyFraction(n){const whole=Math.floor(n+1e-7),frac=n-whole;const options=[[.125,'⅛'],[.25,'¼'],[.333333,'⅓'],[.375,'⅜'],[.5,'½'],[.625,'⅝'],[.666667,'⅔'],[.75,'¾'],[.875,'⅞']];const match=options.find(([v])=>Math.abs(frac-v)<.018);if(match)return (whole?whole+' ':'')+match[1];if(frac<.018)return String(whole);return String(Math.round(n*100)/100)}function parseQty(s,m){const re=/^\s*(?:(\d+)\s+)?(\d+\/\d+|[½¼¾⅓⅔⅛⅜⅝⅞]|\d+(?:[.,]\d+)?)(?=\s|$)/;const match=String(s).match(re);if(!match)return s;const fractions={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};const parse=v=>v in fractions?fractions[v]:v.includes('/')?Number(v.split('/')[0])/Number(v.split('/')[1]):Number(v.replace(',','.'));const number=Number(match[1]||0)+parse(match[2]);return prettyFraction(number*m)+String(s).slice(match[0].length)}function detail(id){const r=recipes.find(x=>x.id===id);if(!r)return;detailId=id;servingMultiplier=1;drawDetail()}function drawDetail(){const r=recipes.find(x=>x.id===detailId);if(!r)return;const n=Math.max(1,Math.round(r.servings*servingMultiplier));open('La receta',`<div class="detailcover">${iconImage(r)}</div><div class="detailintro"><div class="category">${esc(r.category)}</div><h2>${esc(r.title)}</h2><div class="detailstats"><div class="stat"><span>Preparación</span><b>${r.prep} min</b></div><div class="stat"><span>Cocción</span><b>${r.cook} min</b></div><div class="stat"><span>Dificultad</span><b>${esc(r.difficulty)}</b></div><div class="stat"><span>Porciones</span><div class="servings"><button id="minusServing">−</button><b>${n}</b><button id="plusServing">+</button></div></div></div><div class="detailbuttons"><button class="primary" id="startCook">Modo cocina ↗</button><button class="outline" id="editRecipe">Editar</button><button class="outline" id="detailFav">${r.favorite?'♥ Favorita':'♡ Favorita'}</button></div></div><div class="detailcols"><section><h3>Ingredientes</h3>${r.ingredients.length?r.ingredients.map((x,i)=>`<label class="ingredient ${checkedIngredients.get(detailId)?.has(i)?'checked':''}"><input type="checkbox" data-check="${i}" ${checkedIngredients.get(detailId)?.has(i)?'checked':''}><span>${esc(parseQty(x,servingMultiplier))}</span></label>`).join(''):'<p class="help">Sin ingredientes todavía.</p>'}</section><section><h3>El paso a paso</h3>${r.steps.length?r.steps.map((x,i)=>`<div class="step"><span class="stepnum">${String(i+1).padStart(2,'0')}</span><p>${esc(x)}</p></div>`).join(''):'<p class="help">Sin pasos todavía.</p>'}</section></div>${r.notes?`<div class="notes"><h3>Notas del chef</h3><p>${esc(r.notes)}</p></div>`:''}`,true)}function dataPanel(){open('Gestión de datos',`<div class="modalcontent"><div class="dataitem"><h3>Tu recetario, siempre contigo.</h3><p>Descarga todas tus recetas, imágenes guardadas, notas y favoritas en un único archivo JSON. Es recomendable guardar una copia periódicamente.</p><button class="primary" id="exportBtn">↓ Exportar respaldo JSON</button></div><div class="dataitem"><h3>Restaurar una colección</h3><p>Importa un respaldo anterior. Puedes combinarlo con tus recetas actuales o reemplazar toda la colección. Los archivos se validan antes de aplicar cambios.</p><button class="outline" id="importBtn">↑ Importar archivo JSON</button></div><p class="help">Tus datos se almacenan localmente en este navegador, no se sincronizan entre dispositivos. Borrar los datos del navegador puede eliminar las recetas; conserva respaldos externos.</p></div>`)}function exportData(){const data={app:'albahaca',version:1,exportedAt:new Date().toISOString(),recipes};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='albahaca-respaldo-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Respaldo descargado correctamente')}async function importData(file){if(!file)return;try{if(file.size>40*1024*1024)throw Error('El archivo supera los 40 MB.');const obj=JSON.parse(await file.text());const items=Array.isArray(obj)?obj:obj?.recipes;if(!Array.isArray(items)||items.length>10000||items.some(x=>!valid(x)))throw Error('El archivo no contiene una colección válida de recetas.');const incoming=items.map(clean);if(!confirm(`Se encontraron ${incoming.length} recetas válidas. ¿Deseas continuar?`))return;const replace=confirm('Aceptar: REEMPLAZAR todas las recetas actuales.\nCancelar: COMBINAR, conservando las recetas actuales.');const old=[...recipes];if(replace)recipes=incoming;else{const ids=new Set(recipes.map(r=>r.id));for(const r of incoming){if(ids.has(r.id)){const index=recipes.findIndex(x=>x.id===r.id);recipes[index]=r}else{recipes.push(r);ids.add(r.id)}}}if(!save()){recipes=old;return}close();render();toast(`${incoming.length} recetas importadas correctamente`)}catch(e){toast('No se pudo importar: '+e.message)}finally{$('#importFile').value=''}}async function photoData(file){if(!file)return '';if(!file.type.startsWith('image/'))throw Error('Selecciona una imagen válida.');if(file.size>20*1024*1024)throw Error('La imagen es demasiado grande.');const img=await createImageBitmap(file);const ratio=Math.min(1,1200/img.width,1200/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close?.();return canvas.toDataURL('image/jpeg',.75)}$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){category=b.dataset.cat;render()}});$('#search').addEventListener('input',e=>{query=e.target.value;render()});$('#newBtn').onclick=()=>form();$('#backupBtn').onclick=dataPanel;$('#close').onclick=close;$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))close()});$('#grid').addEventListener('click',e=>{if(e.target.closest('#emptyAdd'))return form();const fav=e.target.closest('[data-fav]');if(fav){const r=recipes.find(x=>x.id===fav.dataset.fav);if(r){r.favorite=!r.favorite;save();render()}return}const v=e.target.closest('[data-view]');if(v)detail(v.dataset.view)});$('#modalContent').addEventListener('click',e=>{const add=e.target.closest('[data-add]');if(add){const t=add.dataset.add;$('#'+(t==='steps'?'stepRows':'ingredientRows')).insertAdjacentHTML('beforeend',row(t));return}if(e.target.closest('[data-remove]')){e.target.closest('.repeat').remove();return}if(e.target.closest('#deleteRecipe')){if(confirm('¿Eliminar esta receta definitivamente?')){recipes=recipes.filter(r=>r.id!==editing);save();close();render();toast('Receta eliminada')}return}if(e.target.closest('#exportBtn'))return exportData();if(e.target.closest('#importBtn'))return $('#importFile').click();if(e.target.closest('#editRecipe'))return form(detailId);if(e.target.closest('#detailFav')){const r=recipes.find(x=>x.id===detailId);r.favorite=!r.favorite;save();drawDetail();render();return}if(e.target.closest('#minusServing')){const r=recipes.find(x=>x.id===detailId);servingMultiplier=Math.max(1/r.servings,servingMultiplier-1/r.servings);drawDetail();return}if(e.target.closest('#plusServing')){const r=recipes.find(x=>x.id===detailId);servingMultiplier+=1/r.servings;drawDetail();return}if(e.target.closest('#startCook')){cookId=detailId;cookIndex=0;$('#cook').classList.add('open');document.body.style.overflow='hidden';drawCook()}});$('#modalContent').addEventListener('change',e=>{if(e.target.matches('[data-check]')){const index=Number(e.target.dataset.check);if(!checkedIngredients.has(detailId))checkedIngredients.set(detailId,new Set());const set=checkedIngredients.get(detailId);if(e.target.checked)set.add(index);else set.delete(index);e.target.closest('.ingredient').classList.toggle('checked',e.target.checked)}});$('#modalContent').addEventListener('submit',async e=>{if(e.target.id!=='recipeForm')return;e.preventDefault();const f=e.target,fd=new FormData(f),old=recipes.find(r=>r.id===editing),ingredientInputs=[...f.querySelectorAll('.ingredients-input')],stepInputs=[...f.querySelectorAll('.steps-input')];let image=String(fd.get('image')||'').trim()||f.dataset.existingImage||'';if(image&&!image.startsWith('data:')&&!/^https?:\/\//i.test(image)){toast('La URL de imagen debe comenzar por https://');return}try{const file=$('#photoFile').files[0];if(file)image=await photoData(file)}catch(err){toast(err.message);return}const obj=clean({id:old?.id||uid(),title:String(fd.get('title')||''),category:fd.get('category'),difficulty:fd.get('difficulty'),prep:fd.get('prep'),cook:fd.get('cook'),servings:fd.get('servings'),image,ingredients:ingredientInputs.map(x=>x.value.trim()).filter(Boolean),steps:stepInputs.map(x=>x.value.trim()).filter(Boolean),notes:fd.get('notes'),favorite:old?.favorite||false,created:old?.created||new Date().toISOString()});if(!valid(obj))return toast('Completa el nombre de la receta');const before=[...recipes];if(old)recipes=recipes.map(x=>x.id===old.id?obj:x);else recipes.unshift(obj);if(!save()){recipes=before;return}close();render();toast(old?'Cambios guardados':'Receta guardada')});$('#importFile').addEventListener('change',e=>importData(e.target.files[0]));function drawCook(){const r=recipes.find(x=>x.id===cookId);if(!r||!r.steps.length){$('#cookTitle').textContent=r?.title||'Modo cocina';$('#cookNum').textContent='—';$('#cookText').textContent='Esta receta aún no tiene pasos de preparación. Añádelos desde Editar para cocinar paso a paso.';$('#cookProgress').textContent='Sin pasos';$('#cookPrev').disabled=true;$('#cookNext').disabled=true;return}$('#cookNext').disabled=false;$('#cookTitle').textContent=r.title;$('#cookNum').textContent=String(cookIndex+1).padStart(2,'0');$('#cookText').textContent=r.steps[cookIndex];$('#cookProgress').textContent=`${cookIndex+1} de ${r.steps.length}`;$('#cookPrev').disabled=cookIndex===0;$('#cookNext').textContent=cookIndex===r.steps.length-1?'Terminar ✓':'Siguiente →'}$('#cookPrev').onclick=()=>{cookIndex=Math.max(0,cookIndex-1);drawCook()};$('#cookNext').onclick=()=>{const r=recipes.find(x=>x.id===cookId);if(cookIndex>=r.steps.length-1){exitCook();toast('¡Buen provecho!')}else{cookIndex++;drawCook()}};function exitCook(){$('#cook').classList.remove('open');document.body.style.overflow=$('#overlay').classList.contains('open')?'hidden':''}$('#cookExit').onclick=exitCook;document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#cook').classList.contains('open'))exitCook();else close()}if($('#cook').classList.contains('open')){if(e.key==='ArrowRight')$('#cookNext').click();if(e.key==='ArrowLeft')$('#cookPrev').click()}});load();render()})();
</script></body></html>
